<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#123B5D"/>
      <stop offset="1" stop-color="#176B7A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2675A6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#25826A"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C16D26"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324D; letter-spacing: 0; }
      .title { font-size: 42px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 21px; fill: #DCEEF2; }
      .lane { font-size: 24px; font-weight: 700; fill: #FFFFFF; }
      .node-title { font-size: 23px; font-weight: 700; }
      .node-body { font-size: 18px; fill: #466176; }
      .small { font-size: 16px; fill: #61798C; }
      .tag { font-size: 16px; font-weight: 700; }
      .footer { font-size: 17px; fill: #5B6F80; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F5F8FA"/>
  <rect width="1920" height="126" fill="url(#header)"/>
  <text x="80" y="61" class="title">北斗巡知：北斗时空风险诊断与三层稳健知识回放框架</text>
  <text x="82" y="99" class="subtitle">视觉持续学习主链路 × 北斗时空诊断链路 × 复飞与人工复核决策闭环</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="70" y="197" width="258" height="208" rx="8" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2"/>
    <rect x="70" y="197" width="258" height="54" rx="8" fill="#E9F3FA"/>
    <text x="199" y="232" class="node-title center">无人机巡检数据</text>
    <text x="102" y="291" class="node-body">• 航拍图像 / 目标裁剪</text>
    <text x="102" y="329" class="node-body">• 样本编号 sample_id</text>
    <text x="102" y="367" class="node-body">• 拍摄时间 timestamp</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="562" width="258" height="208" rx="8" fill="#FFFFFF" stroke="#C8D7E2" stroke-width="2"/>
    <rect x="70" y="562" width="258" height="54" rx="8" fill="#E7F5F0"/>
    <text x="199" y="597" class="node-title center">北斗时空数据</text>
    <text x="102" y="656" class="node-body">• 经纬度 / 航迹序号</text>
    <text x="102" y="694" class="node-body">• 定位质量 / 位置误差</text>
    <text x="102" y="732" class="node-body">• 巡检路段 / 区域网格</text>
  </g>

  <!-- Lane labels -->
  <rect x="370" y="154" width="270" height="48" rx="6" fill="#2675A6"/>
  <text x="505" y="186" class="lane center">视觉持续学习主链路</text>
  <rect x="370" y="528" width="270" height="48" rx="6" fill="#25826A"/>
  <text x="505" y="560" class="lane center">北斗时空诊断链路</text>

  <!-- Visual lane -->
  <g filter="url(#shadow)">
    <rect x="390" y="228" width="245" height="150" rx="8" fill="#FFFFFF" stroke="#A9C9DD" stroke-width="2"/>
    <text x="512" y="269" class="node-title center">① 目标识别输入</text>
    <text x="512" y="311" class="node-body center">检测 / 裁剪 / 预处理</text>
    <text x="512" y="344" class="small center">形成顺序到达的目标样本</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="206" width="500" height="194" rx="8" fill="#FFFFFF" stroke="#75AFCF" stroke-width="3"/>
    <text x="960" y="247" class="node-title center">② 三层稳健知识回放</text>
    <rect x="738" y="273" width="138" height="86" rx="6" fill="#EAF4FA" stroke="#B8D3E3"/>
    <text x="807" y="303" class="tag center" fill="#1E668F">第一层</text>
    <text x="807" y="334" class="small center">代表知识保留</text>
    <rect x="891" y="273" width="138" height="86" rx="6" fill="#EAF4FA" stroke="#B8D3E3"/>
    <text x="960" y="303" class="tag center" fill="#1E668F">第二层</text>
    <text x="960" y="334" class="small center">历史知识更新</text>
    <rect x="1044" y="273" width="138" height="86" rx="6" fill="#EAF4FA" stroke="#B8D3E3"/>
    <text x="1113" y="303" class="tag center" fill="#1E668F">第三层</text>
    <text x="1113" y="334" class="small center">新旧风险仲裁</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1285" y="228" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#A9C9DD" stroke-width="2"/>
    <text x="1410" y="269" class="node-title center">③ 识别结果</text>
    <text x="1410" y="311" class="node-body center">目标类别 · 置信度</text>
    <text x="1410" y="344" class="small center">逐样本预测与历史表现</text>
  </g>

  <!-- Spatial lane -->
  <g filter="url(#shadow)">
    <rect x="390" y="604" width="245" height="166" rx="8" fill="#FFFFFF" stroke="#A8D3C5" stroke-width="2"/>
    <text x="512" y="646" class="node-title center">① 时空索引</text>
    <text x="512" y="687" class="node-body center">区域网格 · 巡检路段</text>
    <text x="512" y="722" class="small center">跨架次观测关联</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="604" width="300" height="166" rx="8" fill="#FFFFFF" stroke="#8BC6B3" stroke-width="2"/>
    <text x="860" y="646" class="node-title center">② 局部性能诊断</text>
    <text x="860" y="687" class="node-body center">区域准确率 · 遗忘率</text>
    <text x="860" y="722" class="small center">定位质量 · 预测不稳定性</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1084" y="604" width="276" height="166" rx="8" fill="#FFFFFF" stroke="#8BC6B3" stroke-width="2"/>
    <text x="1222" y="646" class="node-title center">③ 区域风险评估</text>
    <text x="1222" y="687" class="node-body center">模型不稳定性</text>
    <text x="1222" y="719" class="node-body center">× 区域业务后果</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1434" y="588" width="390" height="198" rx="8" fill="#FFF7EE" stroke="#D9A56F" stroke-width="2"/>
    <text x="1629" y="630" class="node-title center">④ 巡检决策输出</text>
    <text x="1471" y="674" class="node-body">• 区域回放预算建议</text>
    <text x="1471" y="712" class="node-body">• 重点区域复飞任务</text>
    <text x="1471" y="750" class="node-body">• 低置信样本人工复核</text>
  </g>

  <!-- Arrows visual -->
  <path d="M 328 302 L 390 302" stroke="#2675A6" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 635 302 L 710 302" stroke="#2675A6" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 1210 302 L 1285 302" stroke="#2675A6" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Arrows spatial -->
  <path d="M 328 686 L 390 686" stroke="#25826A" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 635 686 L 710 686" stroke="#25826A" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 1010 686 L 1084 686" stroke="#25826A" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 1360 686 L 1434 686" stroke="#C16D26" stroke-width="4" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- Sample linkage -->
  <path d="M 1410 378 L 1410 493 L 860 493 L 860 604" stroke="#6D8798" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="1010" y="457" width="310" height="55" rx="6" fill="#FFFFFF" stroke="#B8C8D3"/>
  <text x="1165" y="480" class="tag center">sample_id + timestamp 关联</text>
  <text x="1165" y="501" class="small center">经纬度不直接输入视觉分类网络</text>

  <!-- Planned feedback -->
  <path d="M 1560 786 C 1510 866, 1110 880, 970 402" stroke="#C16D26" stroke-width="3" stroke-dasharray="11 9" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="1070" y="820" width="430" height="58" rx="6" fill="#FFF7EE" stroke="#D9A56F"/>
  <text x="1285" y="844" class="tag center" fill="#9C541C">规划中的训练反馈闭环</text>
  <text x="1285" y="867" class="small center">当前仅输出预算建议，不宣称已提升训练性能</text>

  <!-- Bottom loop -->
  <path d="M 1740 786 C 1740 935, 260 935, 260 770" stroke="#6D8798" stroke-width="3" stroke-dasharray="9 8" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="960" y="927" class="node-body center">重点复飞 / 人工复核 → 新观测积累 → 下一轮持续学习与区域诊断</text>

  <!-- Evidence boundary -->
  <rect x="70" y="970" width="1780" height="68" rx="7" fill="#FFFFFF" stroke="#CDD9E2" stroke-width="2"/>
  <text x="96" y="998" class="tag" fill="#36576E">当前验证边界</text>
  <text x="96" y="1024" class="footer">公开VisDrone航拍数据 + 虚拟北斗坐标、蛇形航线与12米定位扰动；尚未完成真实外业、机载部署和位置预算训练闭环验证。</text>
</svg>
