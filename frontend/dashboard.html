<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="北斗智巡公开实验结果看板" />
    <title>北斗智巡｜公开结果看板</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="evidence" id="evidence">正在核验公开结果文件…</div>
    <header>
      <div>
        <span class="kicker">BEIDOU INSIGHT · PUBLIC EVIDENCE</span>
        <h1>时空局部诊断<br /><em>公开结果看板</em></h1>
        <p>面向北斗无人机巡检的公开证据页，只展示白名单JSON中的数据规模、方法指标、区域风险、回放预算和处置建议。</p>
      </div>
      <nav class="page-actions" aria-label="页面操作"><a class="button-link" href="../mission.html">任务闭环</a>
        <a class="button-link primary" href="./index.html">进入仿真交互页</a>
        <a class="button-link" href="./report.html">正式诊断报告</a>
        <button id="refreshResult" type="button">重新读取</button>
        <button id="downloadResult" type="button">下载公开JSON</button>
      </nav>
    </header>

    <main>
      <section class="summary-grid" aria-label="数据摘要">
        <article><span>数据集</span><b id="datasetName">—</b><small id="releaseId">—</small></article>
        <article><span>观测 / 预测</span><b id="sampleCounts">—</b><small>公开接口计数</small></article>
        <article><span>类别 / 任务</span><b id="taskCounts">—</b><small>类别增量任务流</small></article>
        <article><span>回放预算</span><b id="budgetTotal">—</b><small id="budgetCheck">等待核验</small></article>
        <article><span>结果质量</span><b id="qualityStatus">—</b><small id="qualityDelta">等待核验</small></article>
      </section>

      <section class="panel">
        <div class="heading"><div><span class="kicker">METHOD COMPARISON</span><h2>方法级指标</h2></div><small id="methodHint">读取仓库公开结果</small></div>
        <div class="methods" id="methods"></div>
      </section>

      <section class="panel">
        <div class="heading"><div><span class="kicker">LOCATION-SPECIFIC DIAGNOSTICS</span><h2>区域诊断</h2></div><small>按风险从高到低</small></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>区域</th><th>样本</th><th>识别率</th><th>遗忘率</th><th>风险</th><th>预算</th><th>建议</th></tr></thead>
            <tbody id="locations"></tbody>
          </table>
        </div>
      </section>

      <section class="disclosure"><b>证据边界</b><p id="disclosure">—</p></section>
    </main>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
